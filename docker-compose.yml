version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# CAT MachOps 360 — Docker Compose
#
# Production-ready compose with PostgreSQL + Redis + Backend + Frontend.
#
# Quick start (demo mode — uses SQLite, no Docker needed):
#   cd backend && uvicorn app.main:app --reload --port 8000
#   cd frontend && npm run dev
#
# Full stack with Docker:
#   docker compose up
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: machops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cat
      POSTGRES_PASSWORD: cat_secret
      POSTGRES_DB: machops360
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cat -d machops360"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: machops_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: machops_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      USE_SQLITE: "false"
      DATABASE_URL: postgresql+asyncpg://cat:cat_secret@postgres:5432/machops360
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      APP_ENV: production
      FRONTEND_ORIGIN: http://localhost:5173
      AUTO_SEED_ON_STARTUP: "true"
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ML_MODELS_DIR: /app/ml/models
      ETA_MODEL_PATH: /app/ml/models/eta_model.joblib
      ANOMALY_MODEL_PATH: /app/ml/models/anomaly_model.joblib
    volumes:
      - ../ml/models:/app/ml/models:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Frontend (production build served by nginx) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: machops_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  pgdata:
    driver: local

# ─────────────────────────────────────────────────────────────────────────────
# Development mode (no Docker needed):
#
#   Terminal 1 — Backend (SQLite, no PostgreSQL):
#     cd backend
#     uvicorn app.main:app --reload --port 8000 --host 0.0.0.0
#
#   Terminal 2 — Frontend:
#     cd frontend
#     npm run dev
#
#   Open: http://localhost:5173
#   Login: engineer@cat.com / demo1234
# ─────────────────────────────────────────────────────────────────────────────
